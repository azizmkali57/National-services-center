<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="nscGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3A8A" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
  </defs>
  
  <!-- Rounded Base Badge -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#nscGrad)" />
  
  <!-- Inner Contrast Card -->
  <rect x="5" y="5" width="54" height="54" rx="11" fill="#0F172A" />
  
  <!-- Tech Wrench & Gear Diagnostic Icon -->
  <g transform="translate(12, 10)">
    <!-- Gear / Service Hub -->
    <path d="M20 7 A13 13 0 0 1 33 20 A13 13 0 0 1 20 33 A13 13 0 0 1 7 20 A13 13 0 0 1 20 7 Z" fill="none" stroke="#F59E0B" stroke-width="3" stroke-dasharray="6,3" />
    
    <!-- Shield / Protection -->
    <path d="M20 4 L30 8 L30 18 C30 25 20 29 20 29 C20 29 10 25 10 18 L10 8 Z" fill="#2563EB" opacity="0.3" stroke="#60A5FA" stroke-width="1.5" />
    
    <!-- Wrench Cross -->
    <path d="M14 26 L26 14 M23 11 L29 17 M11 23 L17 29" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Central Verified Spark / Check -->
    <circle cx="20" cy="20" r="4.5" fill="#F59E0B" />
    <path d="M18.5 20 L19.8 21.3 L22 18.8" fill="none" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" />
  </g>
  
  <!-- NSC Letters on Bottom -->
  <text x="32" y="55" fill="#F8FAFC" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="900" letter-spacing="1.5" text-anchor="middle">NSC</text>
</svg>
